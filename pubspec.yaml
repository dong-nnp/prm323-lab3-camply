name: prm393_lab03
description: "PRM393 Lab 3: Android Flutter MVVM foundation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cloud_functions: ^7.0.1
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  firebase_remote_config: ^7.0.1
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.2
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - firebase/remote-config-defaults.json
    - assets/EVIA_Welcome_Hero.png
    - assets/evia-logo-lime-transparent(4).png
    - assets/splash/
    - assets/figma/
